<footer class="mt-20 border-t border-[#e5e7eb] bg-white py-12">
    <div class="max-w-[1200px] mx-auto px-4 md:px-20 lg:px-40 flex flex-col md:flex-row justify-between items-center gap-6">
        <div class="flex items-center gap-2">
            <div class="bg-primary/10 p-1.5 rounded-lg text-primary">
                <span class="material-symbols-outlined block text-lg">school</span>
            </div>
            <span class="text-sm font-bold text-[#111418]">{{ .Site.Params.shortName }}</span>
        </div>
        <p class="text-xs text-gray-400">
            © {{ now.Year }} {{ .Site.Params.author }}. 
        </p>
        <div class="flex gap-6">
            {{ with .Site.Params.email }}
            <a class="text-xs font-bold text-gray-500 hover:text-primary uppercase tracking-widest" href="mailto:{{ . }}">Contact</a>
            {{ end }}
            {{ with .Site.Params.university }}
            <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">{{ . }}</span>
            {{ end }}
        </div>
    </div>
</footer>
